  <!-- ===== MAIN CONTENT: changes on each page ===== -->

    <h1>Contact Me</h1>

    <!-- Quick contact links -->
    <h2>My Contact Details</h2>
    <p><strong>WhatsApp:</strong> <a href="https://wa.me/67579773405" target="_blank">+675 79773405</a></p>
    <p><strong>Instagram:</strong> <a href="https://www.instagram.com/korizu" target="_blank">@korizu</a></p>
    <p><strong>Email:</strong> <a href="mailto:korizuyule9@gmail.com">korizuyule9@gmail.com</a></p>

    <!-- Message form. It opens the visitor's email app addressed to me.
         Each label's "for" matches its input's "id" so screen readers can read the form. -->
    <h2>Send Me a Message</h2>
    <form action="mailto:korizuyule9@gmail.com" method="post" enctype="text/plain">

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" required></textarea>

      <!-- Send button and clear button -->
      <button class="button" type="submit">Send Message</button>
      <button class="button" type="reset">Cancel</button>

    </form>
  </div>
